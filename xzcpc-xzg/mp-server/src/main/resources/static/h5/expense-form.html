<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>支出登记</title>
<style>
:root{--p:#2F8F57;--ps:#E7F4EB;--t1:#1F2421;--t2:#66706A;--t3:#98A19C;--b:#E8ECE9;--bg:#F7F8F6;--d:#E05A47;--w:#E58A2D}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.page{max-width:520px;margin:0 auto;padding:12px 12px 150px}
.card{background:#fff;border-radius:16px;padding:14px;border:1px solid var(--b);box-shadow:0 2px 12px rgba(31,36,33,.04);margin-bottom:10px}
.card-title{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;margin-bottom:8px}
.card-sub{display:block;font-size:11px;color:var(--t2);margin-bottom:8px}
/* 提示条 */
.sp-tip{display:flex;align-items:flex-start;gap:6px;background:#FDF3E7;border:1px solid #F5D9B3;border-radius:10px;padding:9px 12px;margin-bottom:10px}
.sp-tip-icon{font-size:14px;flex-shrink:0}
.sp-tip-text{font-size:12px;color:var(--w);line-height:1.5}
.edit-tip{background:var(--ps);border-color:var(--p)}
.edit-tip .sp-tip-text{color:var(--p)}
/* 类型组 */
.group-head{display:flex;align-items:center;gap:6px}
.group-type-field{flex:1;min-width:0}
.group-desc{display:block;font-size:11px;color:var(--w);margin-top:2px}
.group-del{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t3);cursor:pointer}
.group-del:active{background:#FDECEA;color:var(--d)}
.group-total{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 10px;background:#FFF7E6;border-radius:8px}
.gt-label{font-size:12px;color:#B8860B;font-weight:600}
.gt-amount{font-size:16px;font-weight:800;color:#E6A23C}
.add-group-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px;border-radius:12px;border:1px dashed var(--p);color:var(--p);font-size:14px;font-weight:600;background:var(--ps);margin-bottom:10px;cursor:pointer}
.add-group-btn:active{opacity:.8}
/* 表单字段 */
.field{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:10px}
.field:active{background:#EEF1EF}
.field-col{flex-direction:column;align-items:stretch;gap:4px}
.field-text{flex:1;min-width:0}
.field-label{font-size:12px;color:var(--t2)}
.required{color:var(--d)}
.field-value{display:block;font-size:14px;margin-top:2px}
.field-value.placeholder{color:var(--t3)}
.field-arrow{font-size:16px;color:var(--p);flex-shrink:0}
.field-input{width:100%;font-size:14px;background:transparent;border:none;outline:none;height:24px;line-height:24px;color:var(--t1)}
.field-input::placeholder{color:var(--t3)}
.form-body{display:flex;flex-direction:column;gap:6px}
/* 明细区 */
.mat-section{margin-top:8px;padding:10px;background:#FAFBF9;border-radius:10px;display:flex;flex-direction:column;gap:7px}
.mat-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--p);margin-bottom:2px}
.mat-count{font-size:11px;color:var(--t3);font-weight:400}
.mat-empty{padding:12px 0;text-align:center;font-size:12px;color:var(--t3);background:#fff;border-radius:8px}
.mat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:8px;padding:8px 10px;border:1px solid #EEF1EF;cursor:pointer}
.mat-item:active{background:var(--bg)}
.mi-left{flex:1;min-width:0}
.mi-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-meta{font-size:11px;color:var(--t3);margin-top:2px}
.mi-remark{display:block;font-size:11px;color:var(--t2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.mi-amount{font-size:13px;font-weight:700;color:var(--p)}
.mi-del{flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);background:var(--bg);border-radius:50%;cursor:pointer}
.mi-del:active{background:#EEF1EF;color:var(--d)}
.add-material-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px;border-radius:8px;border:1px dashed var(--p);color:var(--p);font-size:13px;font-weight:600;background:var(--ps);cursor:pointer}
.add-material-btn:active{opacity:.8}
.add-icon{font-size:14px;line-height:1}
.add-material-hint{text-align:center;font-size:11px;color:var(--t3);padding:6px 0}
.mat-field{display:flex;flex-direction:column;gap:4px}
.mat-label{font-size:13px}
.mat-input-box{background:#fff;border-radius:8px;padding:0 12px;height:42px;display:flex;align-items:center;border:1px solid var(--b)}
.mat-input-row{gap:4px}
.mat-input-val{font-size:14px;flex:1;min-width:0;border:none;outline:none;background:transparent;height:42px}
.mat-num{flex:1;min-width:0;font-size:14px;text-align:right;border:none;outline:none;background:transparent;height:42px;color:var(--t1)}
.mat-unit,.mat-symbol{font-size:12px;color:var(--t2);flex-shrink:0}
.mat-total{text-align:right;font-size:14px;font-weight:700;color:var(--p);padding-top:2px}
/* 凭证 */
.voucher-count{font-size:11px;color:var(--t3);font-weight:400;margin-left:auto}
.voucher-grid{display:flex;flex-wrap:wrap;gap:8px}
.voucher-item{position:relative;width:calc((100% - 16px) / 3);height:86px;border-radius:8px;overflow:hidden;background:var(--bg)}
.voucher-img{width:100%;height:100%;object-fit:cover;display:block}
.voucher-del{position:absolute;top:0;right:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:rgba(31,36,33,.55);color:#fff;font-size:11px;border-radius:0 0 0 8px;cursor:pointer;z-index:2}
.voucher-add{width:calc((100% - 16px) / 3);height:86px;border:1px dashed var(--b);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#FAFBF9;box-sizing:border-box;cursor:pointer}
.voucher-add:active{background:#EEF1EF}
.voucher-icon{font-size:20px}
.voucher-text{font-size:11px;color:var(--t3)}
.voucher-uploading{position:absolute;inset:0;background:rgba(31,36,33,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:11px;z-index:1}
.voucher-bar{width:70%;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin-top:6px;overflow:hidden}
.voucher-bar i{display:block;height:100%;background:#fff;border-radius:2px;transition:width .2s}
/* 底部 */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.bottom-inner{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.bottom-total{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:8px}
.bt-label{font-size:12px;color:var(--t2)}
.bt-amount{font-size:22px;font-weight:800;color:var(--p)}
.btn{width:100%;height:46px;border-radius:10px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:none;cursor:pointer}
.btn:active{opacity:.9;transform:scale(.98)}
.btn.disabled{opacity:.6}
/* 弹窗 */
.mask{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;background:rgba(31,36,33,.35)}
/* 弹窗打开时锁页面滚动，防止滚轮/列表滚动穿透到背景页面 */
body.body-lock{overflow:hidden}
.mask.show{display:flex}
.mask.preview-mask{align-items:center;justify-content:center;background:rgba(0,0,0,.9);z-index:150}
.sh{width:40px;height:3px;border-radius:999px;background:var(--b);margin:4px auto 8px;flex-shrink:0}
.sheet{width:100%;max-width:520px;margin:0 auto;max-height:75vh;border-radius:16px 16px 0 0;background:#fff;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;box-shadow:0 -4px 24px rgba(31,36,33,.12);overflow:hidden}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;padding:0 16px;margin-bottom:8px}
.sheet-title{display:block;font-size:16px;font-weight:700}
.sheet-sub{display:block;font-size:11px;color:var(--t3);margin-top:2px}
.sheet-close{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t3);flex-shrink:0;cursor:pointer}
.sheet-list{flex:1;overflow-y:auto;padding:0 12px;max-height:55vh;-webkit-overflow-scrolling:touch}
.dr-body{padding:0 16px 4px;display:flex;flex-direction:column;gap:8px}
.dr-name{font-size:15px;font-weight:700;padding:2px 0}
.dr-total{margin-top:2px}
/* 类型网格 */
.type-grid{display:flex;flex-wrap:wrap;gap:10px}
.type-btn{width:calc((100% - 10px) / 2);padding:10px 9px;border-radius:10px;background:#FAFBF9;border:1px solid var(--b);display:flex;flex-direction:column;box-sizing:border-box;cursor:pointer}
.type-btn-name{font-size:14px;font-weight:600}
.type-btn-desc{font-size:11px;color:var(--w);margin-top:2px;line-height:1.3}
.type-btn.on{background:var(--ps);border-color:var(--p)}
.type-btn.on .type-btn-name{color:var(--p)}
/* 搜索 */
.search-box{padding:0 12px;margin-bottom:6px}
.search-input{width:100%;height:40px;background:#FAFBF9;border-radius:10px;padding:0 12px;font-size:14px;border:none;outline:none;color:var(--t1);box-sizing:border-box}
.search-status{padding:20px 0;text-align:center;font-size:13px;color:var(--t3)}
.search-item{padding:12px 10px;border-bottom:1px solid #EEF1EF;cursor:pointer}
.search-item:last-child{border-bottom:0}
.si-info{flex:1;min-width:0}
.si-name{display:block;font-size:14px;font-weight:500}
.si-meta{display:block;font-size:12px;color:var(--t3);margin-top:2px}
.other-item{border-top:1px solid var(--b);margin-top:4px}
/* loading / toast / preview */
.loading-overlay{position:fixed;inset:0;z-index:99;background:rgba(31,36,33,.35);display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-box{background:#fff;border-radius:12px;padding:16px 24px;font-size:14px}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(31,36,33,.88);color:#fff;font-size:14px;padding:10px 20px;border-radius:10px;display:none;max-width:80%;text-align:center;pointer-events:none}
.toast.show{display:block}
.preview-img{max-width:92vw;max-height:92vh;border-radius:8px}
/* 日期滚轮 */
.wheel-box{position:relative;height:176px;display:flex;padding:8px 12px;overflow:hidden}
.wheel-view{flex:1;height:160px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wheel-view::-webkit-scrollbar{display:none}
.wheel-list{padding:60px 0}
.wheel-item{height:40px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--t2);scroll-snap-align:center;user-select:none}
.wheel-item.on{color:var(--p);font-weight:700;font-size:17px}
/* 选中条：top 相对 .wheel-box(padding box)。wheel-view 可视区 = 8~168(高160，中心88)，
   条高40 → top=88-20=68，中心与可视区中心(88)对齐；渐变遮罩紧贴条上下沿 */
.wheel-selected-line{position:absolute;left:16px;right:16px;top:68px;height:40px;background:rgba(47,143,87,.10);border-radius:10px;pointer-events:none}
.wheel-mask-top{position:absolute;left:12px;right:12px;top:8px;height:60px;background:linear-gradient(to bottom,#fff,rgba(255,255,255,0));pointer-events:none}
.wheel-mask-bottom{position:absolute;left:12px;right:12px;bottom:8px;height:60px;background:linear-gradient(to top,#fff,rgba(255,255,255,0));pointer-events:none}
.sheet-actions{display:flex;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px)}
.sheet-actions .sab{flex:1;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:none;cursor:pointer}
.sab.cancel{background:#FAFBF9;color:var(--t1)}
.sab.danger{background:var(--p);color:#fff}
.sab.danger:active{opacity:.9}
</style>
</head>
<body>
<div class="page">
  <div id="tips"></div>

  <!-- 支出日期（顶部） -->
  <div class="card date-card">
    <div class="field" onclick="openDatePicker()">
      <div class="field-text"><span class="field-label">📅 支出日期 <b class="required">*</b></span></div>
      <span class="field-value" id="dateText" style="font-size:14px">--</span>
      <span class="field-arrow">›</span>
    </div>
  </div>

  <div id="groupsBox"></div>
  <div id="addGroupBox"></div>

  <!-- 凭证 -->
  <div class="card">
    <div class="card-title"><span>📷</span><span>支出凭证</span><span class="voucher-count" id="voucherCount">0/9</span></div>
    <span class="card-sub">请上传发票、收据、付款截图或现场照片，可多张</span>
    <div class="voucher-grid" id="voucherGrid"></div>
    <label id="voucherAdd" class="voucher-add" style="display:none">
      <span class="voucher-icon">📷</span><span class="voucher-text">上传</span>
      <input type="file" accept="image/*" multiple style="width:0;height:0;opacity:0;position:absolute" id="fileInput" />
    </label>
  </div>
</div>

<!-- 底部 -->
<div class="bottom">
  <div class="bottom-inner">
    <div class="bottom-total"><span class="bt-label">合计金额</span><span class="bt-amount" id="totalAmount">¥0.00</span></div>
    <button class="btn" id="submitBtn">提交登记</button>
  </div>
</div>

<!-- 日期滚轮选择 -->
<div class="mask" id="dateMask">
  <div class="sheet">
    <div class="sh"></div>
    <div class="sheet-head">
      <div><span class="sheet-title">选择日期</span><span class="sheet-sub">滚动选择年月日</span></div>
      <span class="sheet-close" onclick="closeDatePicker()">✕</span>
    </div>
    <div class="wheel-box">
      <div class="wheel-view" id="wheelYear"><div class="wheel-list" id="yearList"></div></div>
      <div class="wheel-view" id="wheelMonth"><div class="wheel-list" id="monthList"></div></div>
      <div class="wheel-view" id="wheelDay"><div class="wheel-list" id="dayList"></div></div>
      <div class="wheel-selected-line"></div>
      <div class="wheel-mask-top"></div>
      <div class="wheel-mask-bottom"></div>
    </div>
    <div class="sheet-actions">
      <button class="sab cancel" onclick="closeDatePicker()">取消</button>
      <button class="sab danger" onclick="confirmDatePicker()">确定</button>
    </div>
  </div>
</div>

<!-- 类型选择 -->
<div class="mask" id="typeMask">
  <div class="sheet">
    <div class="sh"></div>
    <div class="sheet-head">
      <div><span class="sheet-title">选择支出类型</span><span class="sheet-sub" id="typeSheetSub">可一次登记多个支出类型</span></div>
      <span class="sheet-close" onclick="closeTypePicker()">✕</span>
    </div>
    <div class="sheet-list" id="typeList"></div>
  </div>
</div>

<!-- 物料搜索 -->
<div class="mask" id="matMask">
  <div class="sheet">
    <div class="sh"></div>
    <div class="sheet-head">
      <span class="sheet-title">选择物料</span>
      <span class="sheet-close" onclick="closeMatSearch()">✕</span>
    </div>
    <div class="search-box"><input class="search-input" id="matSearchInput" placeholder="搜索物料名称" /></div>
    <div class="sheet-list" id="matList"></div>
  </div>
</div>

<!-- 物料抽屉（自购：重量/单价） -->
<div class="mask" id="drawerMask">
  <div class="sheet">
    <div class="sh"></div>
    <div class="sheet-head">
      <span class="sheet-title" id="drawerTitle">添加物料</span>
      <span class="sheet-close" onclick="closeDrawer()">✕</span>
    </div>
    <div class="dr-body">
      <div class="dr-name" id="drawerName"></div>
      <div class="mat-field">
        <span class="mat-label">重量（kg）</span>
        <div class="mat-input-box mat-input-row"><input type="number" step="0.01" class="mat-num" id="drawerWeight" placeholder="请输入重量" /><span class="mat-unit">kg</span></div>
      </div>
      <div class="mat-field">
        <span class="mat-label">单价（元）</span>
        <div class="mat-input-box mat-input-row"><span class="mat-symbol">¥</span><input type="number" step="0.01" class="mat-num" id="drawerPrice" placeholder="请输入单价" /></div>
      </div>
      <div class="mat-field">
        <span class="mat-label">说明（选填）</span>
        <div class="mat-input-box mat-input-row"><input type="text" class="mat-num" id="drawerRemark" placeholder="请输入该物料用途说明" /></div>
      </div>
      <div class="mat-total dr-total" id="drawerTotal">小计：¥0.00</div>
      <button class="btn" onclick="confirmDrawer()">确定</button>
    </div>
  </div>
</div>

<!-- 明细抽屉（其他类型：名称/金额） -->
<div class="mask" id="plainMask">
  <div class="sheet">
    <div class="sh"></div>
    <div class="sheet-head">
      <span class="sheet-title" id="plainTitle">添加明细</span>
      <span class="sheet-close" onclick="closePlainDrawer()">✕</span>
    </div>
    <div class="dr-body">
      <div class="mat-field">
        <span class="mat-label">明细名称</span>
        <div class="mat-input-box"><input type="text" class="mat-input-val" id="plainName" placeholder="请输入明细名称" /></div>
      </div>
      <div class="mat-field">
        <span class="mat-label">明细金额</span>
        <div class="mat-input-box mat-input-row"><span class="mat-symbol">¥</span><input type="number" step="0.01" class="mat-num" id="plainAmount" placeholder="请输入金额" /></div>
      </div>
      <div class="mat-total dr-total" id="plainTotal">小计：¥0.00</div>
      <button class="btn" onclick="confirmPlainDrawer()">确定</button>
    </div>
  </div>
</div>

<!-- 图片预览 -->
<div class="mask preview-mask" id="previewMask" onclick="closePreview()"><img class="preview-img" id="previewImg" /></div>

<div class="loading-overlay" id="loadingOverlay"><div class="loading-box">提交中...</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict'
  // ---------- 参数与认证 ----------
  var TOKEN='',STORE='',EDIT_ID=''
  ;(function(){
    var p=new URLSearchParams(location.search)
    TOKEN=p.get('token')||''
    STORE=p.get('storeName')||''
    EDIT_ID=p.get('expenseId')||''
  })()
  var _i=location.pathname.indexOf('/upload/')
  var API=location.origin+(_i>=0?location.pathname.slice(0,_i):location.pathname.replace(/\/[^/]+$/,''))+'/api/mp'
  function H(){var h={'Content-Type':'application/json'};if(TOKEN)h['Authorization']='Bearer '+TOKEN;return h}

  // ---------- 常量 ----------
  var SELF='自购食材',PARENT='自购食材成本',MAX_GROUPS=10,MAX_ITEMS=10,MAX_VOUCHERS=9
  var CHUNK_SIZE=5*1024*1024,DIRECT_MAX=10*1024*1024

  // ---------- 工具 ----------
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmtMoney(n){return Number(n||0).toFixed(2)}
  function round2(n){return Math.round(n*100)/100}
  // 弹窗锁页面滚动（计数式，嵌套弹窗安全）：修滚轮/列表滚动穿透到背景页面
  var maskCount=0
  function lockScroll(on){if(on){maskCount++;document.body.classList.add('body-lock')}else{maskCount=Math.max(0,maskCount-1);if(!maskCount)document.body.classList.remove('body-lock')}}
  var toastTimer=null
  function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='toast'},2200)}
  function showLoading(txt){document.getElementById('loadingOverlay').getElementsByClassName('loading-box')[0].textContent=txt||'提交中...';document.getElementById('loadingOverlay').className='loading-overlay show'}
  function hideLoading(){document.getElementById('loadingOverlay').className='loading-overlay'}
  function fetchJSON(url,opts){
    return fetch(API+url,opts).then(function(r){return r.json().then(function(d){return{ok:r.ok,body:d}}) }).then(function(res){
      var d=res.body||{}
      if(!res.ok||d.code!==200){
        var e=new Error(d.message||d.msg||'请求失败')
        e.status=res.ok?d.code:res.status
        throw e
      }
      return d.data
    })
  }
  function get(url){return fetchJSON(url,{headers:H()})}
  function post(url,data){return fetchJSON(url,{method:'POST',headers:H(),body:JSON.stringify(data||{})})}
  function put(url,data){return fetchJSON(url,{method:'PUT',headers:H(),body:JSON.stringify(data||{})})}
  function handleErr(e){

    showToast(e.message||'网络异常，请重试')
  }

  function itemAmount(it){var w=parseFloat(it.weight),p=parseFloat(it.unitPrice);if(!(w>0)||!(p>0))return 0;return round2(w*p)}
  function plainItemAmount(it){var a=parseFloat(it.amount);return a>0?round2(a):0}
  function groupAmount(g){
    if(g.typeName===SELF)return round2(g.items.reduce(function(s,it){return s+itemAmount(it)},0))
    var m=parseFloat(g.manualAmount);return m>0?round2(m):0
  }

  // ---------- 日期滚轮选择 ----------
  var DATE_ITEM_H=40

  var DATE_MAX_Y=new Date().getFullYear()+1
  var datePicker={y:0,m:0,d:0}
  function pad2(n){return n<10?'0'+n:''+n}
  function daysInMonth(y,m){return new Date(y,m,0).getDate()}
  function buildDateList(el,arr,sel){
    var html=''
    for(var i=0;i<arr.length;i++){
      html+='<div class="wheel-item'+(i===sel?' on':'')+'" data-i="'+i+'">'+arr[i]+'</div>'
    }
    el.innerHTML=html
  }
  function rebuildDateWheels(){
    var ys=[],ms=[],ds=[]
    for(var y=DATE_MIN_Y;y<=DATE_MAX_Y;y++)ys.push(y+'年')
    for(var m=1;m<=12;m++)ms.push(m+'月')
    var nd=daysInMonth(datePicker.y,datePicker.m)
    if(datePicker.d>nd)datePicker.d=nd
    for(var d=1;d<=nd;d++)ds.push(d+'日')
    buildDateList(document.getElementById('yearList'),ys,datePicker.y-DATE_MIN_Y)
    buildDateList(document.getElementById('monthList'),ms,datePicker.m-1)
    buildDateList(document.getElementById('dayList'),ds,datePicker.d-1)
  }
  // 注意：滚动发生在 .wheel-view 容器（wheelYear/wheelMonth/wheelDay）上，scroll 事件不冒泡到
  // 内部 .wheel-list，监听器必须绑容器；scrollTop 读写也全部针对容器
  function onDateWheelScroll(box,type){
    var idx=Math.round(box.scrollTop/DATE_ITEM_H)
    var maxI=(type==='y'?DATE_MAX_Y-DATE_MIN_Y:(type==='m'?11:daysInMonth(datePicker.y,datePicker.m)-1))
    if(idx<0)idx=0;if(idx>maxI)idx=maxI
    if(box.scrollTop!==idx*DATE_ITEM_H)box.scrollTop=idx*DATE_ITEM_H  // 手动对齐选中线（无 scroll-snap 内核兜底）
    if(type==='y'&&datePicker.y!==DATE_MIN_Y+idx){datePicker.y=DATE_MIN_Y+idx;rebuildDateWheels();document.getElementById('wheelDay').scrollTop=(datePicker.d-1)*DATE_ITEM_H}
    if(type==='m'&&datePicker.m!==idx+1){datePicker.m=idx+1;rebuildDateWheels();document.getElementById('wheelDay').scrollTop=(datePicker.d-1)*DATE_ITEM_H}
    if(type==='d'&&datePicker.d!==idx+1)datePicker.d=idx+1
    var items=box.querySelectorAll('.wheel-item')
    for(var i=0;i<items.length;i++)items[i].className='wheel-item'+(i===idx?' on':'')
  }
  var dateScrollTimers={}
  function bindDateWheel(box,type){
    box.addEventListener('scroll',function(){
      clearTimeout(dateScrollTimers[type])
      dateScrollTimers[type]=setTimeout(function(){onDateWheelScroll(box,type)},90)
    })
  }
  bindDateWheel(document.getElementById('wheelYear'),'y')
  bindDateWheel(document.getElementById('wheelMonth'),'m')
  bindDateWheel(document.getElementById('wheelDay'),'d')
  function openDatePicker(){
    var parts=String(occurredDate).split('-').map(function(s){return parseInt(s,10)})
    var y=parts[0]||DATE_MAX_Y-1,m=parts[1]||1,d=parts[2]||1
    if(y<DATE_MIN_Y)y=DATE_MIN_Y;if(y>DATE_MAX_Y)y=DATE_MAX_Y
    if(m<1)m=1;if(m>12)m=12
    datePicker={y:y,m:m,d:d}
    rebuildDateWheels()
    // 先显示再定位：mask 隐藏(display:none)时元素无布局，scrollTop 赋值被忽略，初始恒为 0 → 选中条与高亮条错位
    document.getElementById('dateMask').className='mask show'
    document.getElementById('wheelYear').scrollTop=(datePicker.y-DATE_MIN_Y)*DATE_ITEM_H
    document.getElementById('wheelMonth').scrollTop=(datePicker.m-1)*DATE_ITEM_H
    document.getElementById('wheelDay').scrollTop=(datePicker.d-1)*DATE_ITEM_H
    lockScroll(true)
  }

  // ---------- 凭证上传 ----------
  function renderVouchers(){
    var html=''
    vouchers.forEach(function(v,i){
      var thumb=null
      if(v.status==='done'&&v.url){
        thumb=v.thumb||v.url
      }else if(v.file){
        try{thumb=URL.createObjectURL(v.file)}catch(e){}
      }
      html+='<div class="voucher-item">'
        +(thumb?'<img class="voucher-img" src="'+esc(thumb)+'" '+(v.status==='done'?'onclick="previewVoucher('+i+')"':'')+' />':'')
        +(v.status==='uploading'
          ?'<div class="voucher-uploading"><span>上传中 '+v.progress+'%</span><div class="voucher-bar"><i style="width:'+v.progress+'%"></i></div></div>'
          :'')
        +'<span class="voucher-del" onclick="removeVoucher('+i+')">✕</span></div>'
    })
    document.getElementById('voucherGrid').innerHTML=html
    document.getElementById('voucherAdd').style.display=vouchers.length<MAX_VOUCHERS?'flex':'none'
    document.getElementById('voucherCount').textContent=vouchers.length+'/'+MAX_VOUCHERS
  }
  function addFiles(input){
    var files=Array.prototype.slice.call(input.files||[])
    input.value=''
    files.forEach(function(f){
      if(vouchers.length>=MAX_VOUCHERS){showToast('最多上传'+MAX_VOUCHERS+'张凭证');return}
      var v={file:f,url:'',thumb:'',status:'uploading',progress:0}
      vouchers.push(v)
      renderVouchers()
      uploadOne(v)
    })
  }
  function uploadOne(v){
    if(v.file.size<=DIRECT_MAX){directUpload(v)}
    else{chunkedUpload(v)}
  }
  function directUpload(v){
    var xhr=new XMLHttpRequest()
    var fd=new FormData()
    fd.append('file',v.file)
    fd.append('storeName',STORE||'unknown')
    xhr.open('POST',API+'/upload/voucher')
    if(TOKEN)xhr.setRequestHeader('Authorization','Bearer '+TOKEN)
    xhr.upload.onprogress=function(e){
      if(e.lengthComputable){v.progress=Math.round(e.loaded/e.total*100);renderVouchers()}
    }
    xhr.onload=function(){
      try{
        var d=JSON.parse(xhr.responseText)
        if(d.code===200){v.url=d.data.url;v.thumb=d.data.thumb||'';v.status='done';v.file=null;renderVouchers()}
        else{showToast(d.message||d.msg||'上传失败');removeVoucherIdx(vouchers.indexOf(v))}
      }catch(e){showToast('上传失败');removeVoucherIdx(vouchers.indexOf(v))}
    }
    xhr.onerror=function(){showToast('网络异常，上传失败');removeVoucherIdx(vouchers.indexOf(v))}
    xhr.send(fd)
  }
  function chunkedUpload(v){
    var size=v.file.size,total=Math.ceil(size/CHUNK_SIZE)
    showToast('大图分片上传中...')
    post('/upload/chunk/init',{totalChunks:total}).then(function(d){
      var uploadId=d.uploadId
      function up(i){
        if(i>=total){
          return post('/upload/chunk/'+uploadId+'/complete',{fileName:v.file.name,totalChunks:total,storeName:STORE||'unknown'}).then(function(r){
            v.url=r.url;v.thumb=r.thumb||'';v.status='done';v.file=null;renderVouchers()
          })
        }
        var blob=v.file.slice(i*CHUNK_SIZE,(i+1)*CHUNK_SIZE)
        var fd=new FormData()
        fd.append('file',blob,v.file.name)
        return new Promise(function(res,rej){
          var xhr=new XMLHttpRequest()
          xhr.open('POST',API+'/upload/chunk/'+uploadId+'/'+i)
          if(TOKEN)xhr.setRequestHeader('Authorization','Bearer '+TOKEN)
          xhr.onload=function(){
            try{var d=JSON.parse(xhr.responseText);if(d.code===200){res()}else{rej(new Error(d.message||'分片失败'))}}catch(e){rej(e)}
          }
          xhr.onerror=function(){rej(new Error('网络异常'))}
          xhr.send(fd)
        }).then(function(){
          v.progress=Math.round((i+1)/total*100)
          renderVouchers()
          return up(i+1)
        })
      }
      return up(0)
    }).catch(function(e){
      showToast(e.message||'上传失败')
      var idx=vouchers.indexOf(v);if(idx>=0)removeVoucherIdx(idx)
    })
  }
  function removeVoucher(i){removeVoucherIdx(i)}
  function removeVoucherIdx(i){
    if(i<0)return
    if(vouchers[i].file){try{URL.revokeObjectURL(vouchers[i].thumb)}catch(e){}}
    vouchers.splice(i,1)
    renderVouchers()
  }
  function previewVoucher(i){
    document.getElementById('previewImg').src=vouchers[i].url
    document.getElementById('previewMask').className='mask preview-mask show'
    lockScroll(true)
  }
  function closePreview(){document.getElementById('previewMask').className='mask preview-mask';lockScroll(false)}
  document.getElementById('fileInput').addEventListener('change',function(){addFiles(this)})

  // ---------- 提交 ----------
  function submit(){
    var btn=document.getElementById('submitBtn')
    if(btn.classList.contains('disabled'))return
    var filled=groups.filter(function(g){return g.typeId})
    if(!filled.length){showToast('请至少选择一个支出类型');return}
    if(EDIT_ID&&filled.length>1){showToast('编辑模式仅支持一个支出类型');return}
    for(var i=0;i<filled.length;i++){
      var g=filled[i]
      if(g.typeName===SELF){
        if(!g.items.length){showToast('请添加物料');return}
        if(g.items.length>MAX_ITEMS){showToast('最多添加'+MAX_ITEMS+'种物料');return}
        for(var j=0;j<g.items.length;j++){
          if(!(parseFloat(g.items[j].weight)>0)){showToast('请填写物料重量');return}
          if(!(parseFloat(g.items[j].unitPrice)>0)){showToast('请填写物料单价');return}
        }
      }else{
        if(!(parseFloat(g.manualAmount)>0)){showToast('请填写【'+g.typeName+'】金额');return}
      }
    }
    for(var u=0;u<vouchers.length;u++){
      if(vouchers[u].status==='uploading'){showToast('请等待凭证上传完成');return}
    }
    btn.classList.add('disabled')
    showLoading(EDIT_ID?'保存中...':'提交中...')
    var urls=vouchers.map(function(v){return v.url})
    var payload={
      typeId:filled[0].typeId,amount:groupAmount(filled[0]),occurredDate:occurredDate,
      handlerName:handlerName||'--',voucherUrls:urls,
      // 编辑（单组扁平）携带说明；新增 batch 不传整单说明——否则后端会把它回退给没有说明的组
      // （如：首组货运物流费带说明、自购组无说明时，自购记录会错误拿到货运说明）
      remark:EDIT_ID?(filled[0].remark||undefined):undefined
    }
    if(EDIT_ID){
      var g0=filled[0]
      if(g0.typeName===SELF){
        payload.items=g0.items.map(function(it){
          return{materialId:it.materialId||undefined,materialName:it.materialName,parentCategory:it.parentCategory||undefined,category:it.category||undefined,weight:parseFloat(it.weight),unitPrice:parseFloat(it.unitPrice),remark:it.remark||undefined}
        })
      }
      return put('/expenses/'+EDIT_ID,payload).then(function(){done(true)}).catch(function(e){handleErr(e);btn.classList.remove('disabled')}).finally(hideLoading)
    }
    payload.records=filled.map(function(g){
      var rec={typeId:g.typeId,amount:groupAmount(g),remark:g.remark||undefined}
      if(g.typeName===SELF){
        rec.items=g.items.map(function(it){
          return{materialId:it.materialId||undefined,materialName:it.materialName,parentCategory:it.parentCategory||undefined,category:it.category||undefined,weight:parseFloat(it.weight),unitPrice:parseFloat(it.unitPrice),remark:it.remark||undefined}
        })
      }
      return rec
    })
    return post('/expenses/batch',payload).then(function(){done(false)}).catch(function(e){handleErr(e);btn.classList.remove('disabled')}).finally(hideLoading)
  }
  function done(isEdit){
    showToast(isEdit?'修改成功':'登记成功')
    // 通知小程序容器刷新列表并返回；浏览器直开（无 wx.miniProgram）时降级为跳回列表页
    if(typeof wx!=='undefined'&&wx.miniProgram){
      wx.miniProgram.postMessage({data:{type:'expense-submitted',isEdit:isEdit}})
      setTimeout(function(){wx.miniProgram.navigateBack({delta:1})},600)
    }else{
      setTimeout(function(){
        location.href='expense-list.html?token='+encodeURIComponent(TOKEN)+'&storeName='+encodeURIComponent(STORE)
      },900)
    }
  }
  document.getElementById('submitBtn').addEventListener('click',submit)

  // ---------- 初始化 ----------
  // 支出说明已取消总/组级（自购的说明在每条物料明细里）；日期改用滚轮选择器（openDatePicker）
  document.getElementById('typeMask').addEventListener('click',function(e){if(e.target===this)closeTypePicker()})
  document.getElementById('matMask').addEventListener('click',function(e){if(e.target===this)closeMatSearch()})
  document.getElementById('drawerMask').addEventListener('click',function(e){if(e.target===this)closeDrawer()})
  document.getElementById('plainMask').addEventListener('click',function(e){if(e.target===this)closePlainDrawer()})

  // ---------- 导出到 window（inline onclick 需全局可见） ----------
  window.addGroup=addGroup
  window.closeDrawer=closeDrawer
  window.closeMatSearch=closeMatSearch
  window.closePlainDrawer=closePlainDrawer
  window.closePreview=closePreview
  window.closeTypePicker=closeTypePicker
  window.confirmDrawer=confirmDrawer
  window.confirmPlainDrawer=confirmPlainDrawer
  window.openEditDrawer=openEditDrawer
  window.openMatSearch=openMatSearch
  window.openPlainAddDrawer=openPlainAddDrawer
  window.openPlainEditDrawer=openPlainEditDrawer
  window.openTypePicker=openTypePicker
  window.previewVoucher=previewVoucher
  window.removeGroup=removeGroup
  window.removeVoucher=removeVoucher
  window.onManualAmount=onManualAmount
  window.onGroupRemark=onGroupRemark
  window.openDatePicker=openDatePicker
  window.closeDatePicker=closeDatePicker
  window.confirmDatePicker=confirmDatePicker

  function boot(){
    if(!TOKEN){showToast('登录已过期，请重新进入小程序')}
    document.getElementById('dateText').textContent=occurredDate
    var p1=get('/expense-types').then(function(d){types=Array.isArray(d)?d:[]}).catch(function(e){showToast('支出类型加载失败：'+(e.message||'网络异常'));throw e})
    var p2=get('/auth/me').then(function(d){
      handlerName=(d&&d.employeeName)||''
    }).catch(function(){})
    if(EDIT_ID){
      document.getElementById('submitBtn').textContent='保存修改'
      // 编辑回填：详情 + 明细 → 单组
      Promise.all([p1,get('/expenses/'+EDIT_ID),get('/expenses/'+EDIT_ID+'/items')]).then(function(res){
        var d=res[1],its=res[2]||[]
        if(!d)return
        var g=newGroup()
        g.typeId=d.typeId||''
        g.typeName=d.typeName||'请选择支出类型'
        if(!g.typeId&&g.typeName!=='请选择支出类型'){
          var matched=types.filter(function(t){return t.name===g.typeName})[0]
          if(matched)g.typeId=matched.typeId
        }
        var mt=types.filter(function(t){return t.typeId===g.typeId})[0]
        if(mt)g.typeDesc=mt.description||''
        g.remark=d.remark||''
        occurredDate=d.occurredDate||''
        handlerName=d.handlerName||handlerName
        document.getElementById('dateText').textContent=occurredDate
        var urls=(d.voucherUrls&&d.voucherUrls.length)?d.voucherUrls:(d.voucherUrl?[d.voucherUrl]:[])
        vouchers=(Array.isArray(urls)?urls:[]).map(function(u){return{file:null,url:u,thumb:'',status:'done',progress:100}})
        if(d.typeName===SELF&&Array.isArray(its)&&its.length){
          g.items=its.map(function(mat){
            return{materialId:mat.materialId||'',materialName:mat.name,parentCategory:mat.parentCategory||'',category:mat.category||'',weight:mat.qty!=null?String(mat.qty):'',unitPrice:mat.unitPrice!=null?String(mat.unitPrice):'',remark:mat.remark||''}
          })
        }else if(d.typeName!==SELF){
          // 其他类型：仅回填总金额（多明细仅自购食材支持）
          g.manualAmount=d.amount!=null?String(d.amount):''
        }
        groups=[g]
        renderGroups();renderVouchers()
      }).catch(handleErr)
    }else{
      groups=[newGroup()]
      Promise.all([p1,p2]).catch(function(){}).then(function(){
        renderGroups();renderVouchers()
        // 新增时自动弹出类型选择，减少一步操作
        setTimeout(function(){openTypePicker(0)},350)
      })
    }
  }
  boot()
})()
</script>
</body>
