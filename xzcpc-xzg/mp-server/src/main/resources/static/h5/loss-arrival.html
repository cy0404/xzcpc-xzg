<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>到货验收报损</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F7F8F6;color:#1F2421;font-size:14px}
.page{max-width:500px;margin:0 auto;padding:16px;padding-bottom:100px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;border:1px solid #E8ECE9}
.card-title{font-size:14px;color:#66706A;margin-bottom:10px}
.req{color:#E05A47;margin-left:2px}
input,textarea{width:100%;padding:12px 14px;border:1px solid #E8ECE9;border-radius:12px;font-size:15px;background:#FAFBF9;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:#2F8F57}
textarea{height:90px;resize:none}
.warn-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;background:#FDF3E7;border-radius:16px;margin-bottom:14px;font-size:13px;color:#E58A2D;line-height:1.5}
.warn-icon{font-size:18px;flex-shrink:0}
.search-tap{border:1px solid #E8ECE9;border-radius:12px;padding:14px;color:#98A19C;background:#FAFBF9;cursor:pointer}
.selected{display:flex;align-items:center;padding:12px 14px;border:1px solid #2F8F57;border-radius:12px;background:#E7F4EB;gap:8px}
.sel-name{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-clear{font-size:20px;color:#98A19C;cursor:pointer;padding:0 4px}
.results{max-height:280px;overflow-y:auto;margin-top:8px;border:1px solid #E8ECE9;border-radius:12px;background:#fff}
.res-item{padding:10px 6px;border-bottom:1px solid #EEF1EF;cursor:pointer}.res-item:last-child{border-bottom:0}
.res-name{font-weight:500}.res-meta{display:block;font-size:12px;color:#98A19C;margin-top:2px}
.res-empty{text-align:center;color:#98A19C;font-size:13px;padding:20px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:10px 22px;border-radius:999px;font-size:14px;border:1.5px solid #E8ECE9;color:#66706A;background:#fff;cursor:pointer}
.pill.on{border-color:#2F8F57;color:#2F8F57;background:#E7F4EB}
.hint{padding:10px 14px;margin-top:8px;border-radius:10px;background:#E7F4EB;font-size:13px;color:#2F8F57}
.unit-row{display:flex;align-items:center;gap:10px;margin-top:10px}.unit-row input{flex:1}
.unit-suffix{font-size:14px;color:#66706A;flex-shrink:0}
.amount-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid #EEF1EF}
.amount-val{font-size:20px;font-weight:700;color:#2F8F57}
.amount-price{font-size:13px;color:#66706A}
.amount-warn{font-size:12px;color:#E58A2D;margin-top:4px}
.up-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.up-btn{width:100px;height:100px;border:1.5px dashed #E8ECE9;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#FAFBF9;cursor:pointer;font-size:12px;color:#66706A;position:relative;overflow:hidden}
.up-icon{font-size:28px}
.up-hint{font-size:12px;color:#E58A2D;margin-top:4px;margin-bottom:4px}
.file-item{width:100px;height:100px;border-radius:12px;overflow:hidden;position:relative;background:#000}
.file-item img{width:100%;height:100%;object-fit:cover}
.file-item .play-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;pointer-events:none}
.file-item .progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(0,0,0,.3)}
.file-item .progress-bar{height:100%;background:#2F8F57;transition:width .3s}
.file-item .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;z-index:1}
.submit-bar{position:fixed;bottom:0;left:0;right:0;padding:14px 20px;padding-bottom:calc(env(safe-area-inset-bottom)+14px);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);z-index:10}
.submit-btn{width:100%;padding:16px;border-radius:12px;font-size:17px;font-weight:700;background:#2F8F57;color:#fff;border:none;cursor:pointer}
.submit-btn:disabled{opacity:.6}
.loading-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.loading-text{color:#fff;font-size:15px}
@keyframes spin{to{transform:rotate(360deg)}}
.search-drawer{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);align-items:flex-end}
.search-drawer.on{display:flex}
.search-drawer-sheet{width:100%;max-height:70vh;background:#fff;border-radius:16px 16px 0 0;padding:16px 12px;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom)+16px)}
.search-drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:17px;font-weight:700}
.video-modal{display:none;position:fixed;inset:0;z-index:300;background:#000}
.video-modal.on{display:flex;align-items:center;justify-content:center}
.video-modal video{width:100%;height:100%;object-fit:contain}
.video-close{position:fixed;top:24px;right:24px;z-index:301;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.guide-video-thumb{width:100%;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;background:#000;margin-bottom:8px}
.guide-video-thumb video{width:100%;display:block;border-radius:8px}
.guide-video-thumb .play-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;color:rgba(255,255,255,.85);pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>
</head>
<body>
<!-- 统一搜索抽屉（物料+订单） -->
<div class="search-drawer" id="search-drawer" onclick="closeSearch()"><div class="search-drawer-sheet" onclick="event.stopPropagation()"><div class="search-drawer-head"><span>搜索</span><span onclick="closeSearch()" style="font-size:20px;cursor:pointer">✕</span></div><div style="position:relative;margin-bottom:12px"><input id="search-input" placeholder="搜索物料名称或报货单号" oninput="onSearch()" /><span onclick="var el=document.getElementById('search-input');el.value='';onSearch()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px;color:#98A19C;cursor:pointer;display:none" id="search-clear">✕</span></div><div class="results" id="results"></div></div></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div><div class="loading-text" id="loading-msg">提交中...</div></div>
<div class="video-modal" id="video-modal"><video id="guide-video-player" src="" playsinline controls webkit-playsinline x5-video-player-type="h5"></video><span class="video-close" onclick="closeVideo()">✕</span></div>
<div class="page">
  <div class="warn-bar"><span class="warn-icon">⚠️</span><span>仅限企迈平台发的货支持到货验收报损，收货后请立即报损</span></div>

  <!-- 报损指引（默认展示） -->
  <div id="guide-card" style="background:#FFF8EE;border-radius:16px;padding:20px;margin-bottom:14px;border:1px solid #FCD5B0">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">报损指引 <span style="font-size:13px;color:#2F8F57;font-weight:400;cursor:pointer;white-space:nowrap" onclick="openGuide()">查看详情 ›</span></div>
    <div id="guide-content"></div>
  </div>

  <!-- 报损商品（统一选择） -->
  <div class="card">
    <div class="card-title">报损商品 <span class="req">*</span></div>
    <div id="search-tap" class="search-tap" onclick="showSearch()">点击选择报货单中的商品 ›</div>
    <div class="selected" id="selected-item" style="display:none">
      <span class="sel-name" id="sel-name"></span>
      <span class="sel-clear" onclick="clearItem()">✕</span>
    </div>
    <div id="order-info" style="margin-top:8px;display:none">
      <div id="order-detail-card" style="background:#FAFBF9;border-radius:10px;padding:12px;font-size:13px;line-height:2;display:none">
        <div><span style="color:#98A19C">单号</span> <span id="sel-order-no" style="color:#1F2421;font-weight:500;margin-left:8px"></span></div>
        <div><span style="color:#98A19C">下单时间</span> <span id="sel-order-time" style="color:#1F2421;margin-left:8px"></span></div>
        <div style="color:#66706A;margin-top:4px;padding-top:4px;border-top:1px dashed #E8ECE9"><span style="color:#98A19C">物品</span> <span id="sel-order-prod-name" style="color:#1F2421;font-weight:500;margin-left:8px"></span></div>
        <div><span style="color:#98A19C">订货数量</span> <span id="sel-order-qty" style="color:#1F2421;margin-left:8px"></span></div>
        <div><span style="color:#98A19C">订货金额</span> <span id="sel-order-amount" style="color:#2F8F57;margin-left:8px"></span></div>
      </div>
      <div id="order-products" style="max-height:200px;overflow-y:auto;margin-top:6px"></div>
      <div id="order-product-hint" style="font-size:12px;color:#98A19C;margin-top:4px;display:none"></div>
    </div>
  </div>
  <!-- 牛油果泥厂家选择 -->
  <div class="card" id="supplier-card" style="display:none">
    <div class="card-title">厂家（牛油果泥专用）<span class="req">*</span></div>
    <div id="supplier-warn" style="font-size:12px;color:#E58A2D;margin-bottom:8px">⚠ 牛油果泥有两个厂家供货，请区分厂家报损</div>
    <div class="pills" id="supplier-pills">
      <span class="pill" id="sup-hass" onclick="selectSupplier('hass牛油果')">hass牛油果</span>
      <span class="pill" id="sup-lanwa" onclick="selectSupplier('蓝蛙牛油果')">蓝蛙牛油果</span>
    </div>
  </div>
  <!-- 加急 -->
  <div class="card"><div class="card-title">是否加急</div><div class="pills"><span class="pill on" id="urgent-no" onclick="setUrgent(false)">否</span><span class="pill" id="urgent-yes" onclick="setUrgent(true)">是</span></div></div>
  <!-- 单位+数量+金额 -->
  <div class="card" id="unit-card" style="display:none"><div class="card-title">报损单位</div><div class="pills" id="unit-pills"></div><div class="hint" id="unit-hint" style="display:none"></div><div class="card-title" style="margin-top:16px">报损数量</div><div class="unit-row"><input id="qty" type="number" step="0.01" placeholder="0" oninput="calcAmount()" /><span class="unit-suffix" id="unit-label"></span></div><div class="amount-row"><span class="amount-price" id="unit-price-display">单价：--</span><span class="amount-val" id="amount-display">¥0.00</span></div><div class="amount-warn" id="amount-warn" style="display:none">⚠ 该物料未配置单价</div></div>
  <!-- 原因 -->
  <div class="card"><div class="card-title">报损原因</div><div class="pills" id="reason-pills"></div></div>
  <!-- 备注 -->
  <div class="card"><div class="card-title">备注 <span id="remark-required" style="display:none">（必填）</span></div><textarea id="remark" placeholder="备注信息"></textarea></div>
  <!-- 凭证 -->
  <div class="card">
    <div class="card-title">现场凭证 <span class="req">*</span></div><span style="font-size:12px;color:#98A19C">请用水印相机拍摄 · 最多4个 · 每个不超200M</span>
    <div class="up-hint" id="upload-hint"></div>
    <div class="up-row" id="upload-row">
      <label class="up-btn"><input type="file" accept="image/*" multiple onchange="addFiles(this)" style="width:0;height:0;opacity:0;position:absolute" /><span class="up-icon">📷</span><span>图片</span></label>
      <label class="up-btn"><input type="file" accept="video/*" onchange="addFiles(this)" style="width:0;height:0;opacity:0;position:absolute" /><span class="up-icon">🎬</span><span>视频</span></label>
    </div>
  </div>
</div>
<div class="submit-bar"><button class="submit-btn" onclick="submit()" id="submit-btn">提交报损</button></div>
<script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script>
var API=window.location.origin+window.location.pathname.split('/upload/')[0]+'/api/mp'
var qs=new URLSearchParams(location.search),TOKEN=qs.get('token')||'',STORE_NAME=qs.get('storeName')||'',RESUBMIT_ID=qs.get('resubmit')||''
function H(){var h={'Content-Type':'application/json'};if(TOKEN)h['Authorization']='Bearer '+TOKEN;return h}

var selected=null,unitPrice=0,inputUnit='',isUrgent=false,mediaList=[],submitting=false
var reasons=['运输破损-外包装','运输破损-内包装','少货','错发','临期或变质','其他']
var searchTimer=null,_searchCache=[],MAX_SIZE=200*1024*1024
var _ordersWithProducts=[],_selectedOrder=null,_selectedOrderNo='',_selectedOrderProductIdx=-1,_ordersPreloaded=false,_instoreProductMap={}
var _avocadoSupplier=''

function showToast(msg){var t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:999;background:rgba(0,0,0,.85);color:#fff;padding:20px 32px;border-radius:12px;font-size:16px;font-weight:600';document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(function(){document.body.contains(t)&&document.body.removeChild(t)},300)},3000)}

var GUIDE_VIDEO_URL='',GUIDE_POSTER_URL=''
function initGuideVideoUrl(){var base=window.location.origin+window.location.pathname.split('/upload/')[0];GUIDE_VIDEO_URL=base+'/upload/h5/video/BS.mp4';GUIDE_POSTER_URL=base+'/upload/h5/video/BS-poster.jpg'}
function playGuideVideo(){document.getElementById('video-modal').classList.add('on');var v=document.getElementById('guide-video-player');v.src=GUIDE_VIDEO_URL;v.poster=GUIDE_POSTER_URL;v.play().catch(function(){})}
function closeVideo(){document.getElementById('video-modal').classList.remove('on');var v=document.getElementById('guide-video-player');v.pause();v.src='';v.poster=''}

// ====== 文件 ======
function addFiles(inp){if(inp._busy)return;inp._busy=true;setTimeout(function(){inp._busy=false},500)
  var files=inp.files;if(!files||!files.length){inp._busy=false;return}
  var valid=[]
  for(var i=0;i<files.length;i++){var f=files[i];if(!f)continue;var sz=Number(f.size)||0
    if(sz>MAX_SIZE){var mb=Math.round(sz/1048576);showToast((mb>=1024?'文件 '+(mb/1024).toFixed(1)+'G':'文件 '+mb+'M')+' 超过200M限制，已跳过');continue}
    if(mediaList.length+valid.length>=4){showToast('最多4个文件');break}
    valid.push(f)}
  for(var j=0;j<valid.length;j++){var ff=valid[j];mediaList.push({file:ff,uploading:true,url:'',isVideo:ff.type.startsWith('video/'),progress:0});uploadFile(mediaList[mediaList.length-1],mediaList.length-1)}
  renderMedia()}

function uploadFile(item,idx){var CHUNK=5*1024*1024,MAX_DIRECT=10*1024*1024
  if(item.file.size<=MAX_DIRECT){directUpload(item,idx);return}
  chunkedUpload(item,idx)}
function directUpload(item,idx){var fd=new FormData();fd.append('file',item.file);fd.append('storeName',STORE_NAME)
  var xhr=new XMLHttpRequest();xhr.upload.onprogress=function(e){if(e.lengthComputable){mediaList[idx].progress=Math.round(e.loaded/e.total*100);renderMedia()}}
  xhr.onload=function(){if(xhr.status===200){try{var d=JSON.parse(xhr.responseText);if(d.code===200){mediaList[idx].url=d.data.url;mediaList[idx].thumb=d.data.thumb||'';mediaList[idx].uploading=false}}catch(e){mediaList[idx].failed=true;mediaList[idx].uploading=false}}else{mediaList[idx].failed=true;mediaList[idx].uploading=false}renderMedia()}
  xhr.onerror=function(){mediaList[idx].failed=true;mediaList[idx].uploading=false;renderMedia()};xhr.open('POST',API+'/upload/voucher');if(TOKEN)xhr.setRequestHeader('Authorization','Bearer '+TOKEN);xhr.send(fd)}
async function chunkedUpload(item,idx){var CHUNK=5*1024*1024,file=item.file,ext=file.name.split('.').pop()||'mp4',fileName='vid_'+Date.now()+'.'+ext,totalChunks=Math.ceil(file.size/CHUNK)
  try{var initRes=await fetch(API+'/upload/chunk/init',{method:'POST',body:'{}',headers:{'Content-Type':'application/json'}});var initD=await initRes.json();if(initD.code!==200)throw new Error('init failed');var uploadId=initD.data.uploadId
    for(var i=0;i<totalChunks;i++){var start=i*CHUNK,end=Math.min(start+CHUNK,file.size),chunk=file.slice(start,end),fd=new FormData();fd.append('file',chunk,fileName+'.part'+i);var ok=false
      for(var retry=0;retry<3;retry++){try{var res=await fetch(API+'/upload/chunk/'+uploadId+'/'+i,{method:'POST',body:fd});if(res.status===200){ok=true;break}}catch(e){}}
      if(!ok)throw new Error('chunk '+i+' failed')
      mediaList[idx].progress=Math.round((i+1)/totalChunks*90);renderMedia()}
    mediaList[idx].progress=95;renderMedia()
    var compRes=await fetch(API+'/upload/chunk/'+uploadId+'/complete',{method:'POST',headers:H(),body:JSON.stringify({fileName:fileName,totalChunks:totalChunks,storeName:STORE_NAME})})
    var compD=await compRes.json();if(compD.code!==200)throw new Error('complete failed')
    mediaList[idx].url=compD.data.url;mediaList[idx].thumb=compD.data.thumb||'';mediaList[idx].uploading=false;mediaList[idx].progress=100;renderMedia()
  }catch(e){mediaList[idx].failed=true;mediaList[idx].uploading=false;renderMedia()}}
function removeFile(idx){mediaList.splice(idx,1);renderMedia()}
function renderMedia(){var h='';for(var i=0;i<mediaList.length;i++){var m=mediaList[i],thumb=m.thumb&&m.isVideo?m.thumb:''
  h+='<div class="file-item" onclick="previewMedia('+i+')">'+(m.isVideo?(thumb?'<img src="'+thumb+'" /><div class="play-icon" style="font-size:20px;right:4px;bottom:4px;inset:auto;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.5);position:absolute">▶</div>':'<div class="play-icon">▶</div>'):(m.url?'<img src="'+m.url+'" />':'<div class="play-icon" style="font-size:20px">📷</div>'))
  if(m.uploading)h+='<div class="progress"><div class="progress-bar" style="width:'+m.progress+'%"></div></div>'
  h+='<span class="del" onclick="event.stopPropagation();removeFile('+i+')">✕</span></div>'}
  if(mediaList.length<4)h+='<label class="up-btn"><input type="file" accept="image/*" multiple onchange="addFiles(this)" style="width:0;height:0;opacity:0;position:absolute" /><span class="up-icon">📷</span><span>图片</span></label><label class="up-btn"><input type="file" accept="video/*" onchange="addFiles(this)" style="width:0;height:0;opacity:0;position:absolute" /><span class="up-icon">🎬</span><span>视频</span></label>'
  document.getElementById('upload-row').innerHTML=h}
function previewMedia(idx){var m=mediaList[idx];if(!m.url)return
  if(m.isVideo){var v=document.createElement('video');v.src=m.url;v.controls=true;v.style.cssText='position:fixed;inset:0;z-index:200;width:100%;height:100%;background:#000';v.onclick=function(){document.body.removeChild(v)};document.body.appendChild(v);v.play()}
  else{var im=document.createElement('img');im.src=m.url;im.style.cssText='position:fixed;inset:0;z-index:200;width:100%;height:100%;object-fit:contain;background:#000';im.onclick=function(){document.body.removeChild(im)};document.body.appendChild(im)}}

// ====== 物料 ======
function showSearch(){document.getElementById('search-drawer').classList.add('on');document.getElementById('search-input').focus();onSearch()}
function closeSearch(){document.getElementById('search-drawer').classList.remove('on')}
function onSearch(){clearTimeout(searchTimer);var kw=document.getElementById('search-input').value.trim();document.getElementById('search-clear').style.display=kw?'block':'none'
  searchTimer=setTimeout(function(){
    document.getElementById('results').innerHTML='<div class="res-empty">搜索中...</div>'
    var isAvocadoSearch=kw.indexOf('牛油')>=0
    if(!_ordersPreloaded&&!_ordersLoading)loadOrders()

    if(isAvocadoSearch){
      // 牛油果泥：仅搜物料库，不搜报货单
      var matReady=false
      fetch(API+'/loss-report/materials/search?keyword='+encodeURIComponent(kw)+'&lossObject=finished',{headers:H()}).then(function(r){return r.json()}).then(function(d){
        matReady=true;_searchCache=(d.data&&d.data.list)||[];tryRenderAvocado()
      }).catch(function(){matReady=true;_searchCache=[];tryRenderAvocado()})
      function tryRenderAvocado(){
        if(!matReady)return
        var list=_searchCache||[],h=''
        if(list.length>0){
          h+='<div style="font-size:13px;color:#66706A;padding:4px 6px 8px">牛油果泥</div>'
          for(var i=0;i<list.length;i++){
            var cat=list[i].category||''
            h+='<div class="res-item" onclick="selectMaterial('+i+')"><div class="res-name">'+esc(list[i].materialName)+'</div><div class="res-meta">'+esc(list[i].spec||'--')+' · <span style="background:#E7F4EB;color:#2F8F57;padding:2px 8px;border-radius:4px;font-size:11px">'+esc(cat)+'</span></div></div>'
          }
        }else{
          h+='<div class="res-empty">暂无匹配物品</div>'
        }
        document.getElementById('results').innerHTML=h
      }
    }else{
      // 非牛油果：仅搜索预加载报货单中的商品，不在单子里的物料不可报损
      var ordersDone=false
      setTimeout(function(){ordersDone=true;tryRenderOrders()},600)
      function tryRenderOrders(){
        if(!ordersDone)return

  fetch(API+'/loss-report/qmai-declare-orders',{headers:H()}).then(function(r){return r.json()}).then(function(d){

    var resp=d.data||{}
    var list=resp.orders||[]

    preloadOrderDetails(list,0,[])
  }).catch(function(e){
    _ordersLoading=false;showToast('加载报货单失败')
  })

/** 逐条预加载订单详情（串行，避免令牌冲突） */
function preloadOrderDetails(list,idx,result){
  if(idx>=list.length){
    _ordersWithProducts=result;_ordersPreloaded=true;_ordersLoading=false
    return
  }
  var orderNo=list[idx].declareNo
  fetch(API+'/loss-report/qmai-declare-orders?declareNo='+encodeURIComponent(orderNo),{headers:H()}).then(function(r){return r.json()}).then(function(d){
    if(d.code===200&&d.data){
      // 详情接口不返单号字段，从列表摘要合并过来
      var merged=d.data
      if(!merged.requireNoList||merged.requireNoList.length===0)merged.requireNoList=list[idx].requireNoList
      if(!merged.purchaseApplyNoList||merged.purchaseApplyNoList.length===0)merged.purchaseApplyNoList=list[idx].purchaseApplyNoList
      if(!merged.bizNoList||merged.bizNoList.length===0)merged.bizNoList=list[idx].bizNoList
      if(!merged.bizNo)merged.bizNo=list[idx].bizNo
      if(!merged.requireNo)merged.requireNo=list[idx].requireNo
      result.push(merged)
    }
    else{result.push(list[idx])} // 详情失败则用摘要兜底
    preloadOrderDetails(list,idx+1,result)
  }).catch(function(){
    result.push(list[idx])
    preloadOrderDetails(list,idx+1,result)
  })
}

async function submit(){if(submitting)return;if(!selected){showToast('请选择物料');return};var qty=parseFloat(document.getElementById('qty').value)||0;if(qty<=0){showToast('请填写报损数量');return};var orderNo=_selectedOrder?orderDisplayNo(_selectedOrder):'';if(!isAvocado(selected)&&!orderNo){showToast('请选择企迈报货单');return};if(isAvocado(selected)&&!_avocadoSupplier){showToast('请选择牛油果泥厂家');return};var reasonEl=document.querySelector('#reason-pills .pill.on');if(!reasonEl){showToast('请选择报损原因');return};var reason=reasonEl.textContent,remark=document.getElementById('remark').value.trim();if(reason==='错发'&&!remark){showToast('请填写备注说明错发情况');return};if(isAvocado(selected)&&_avocadoSupplier){remark='【'+_avocadoSupplier+'】'+(remark||'')};if(!mediaList.length){showToast('请上传现场凭证');return};if(mediaList.some(function(m){return m.uploading})){showToast('有文件正在上传中');return};var videoCount=mediaList.filter(function(m){return m.isVideo}).length;if(['运输破损-外包装','运输破损-内包装','临期或变质'].indexOf(reason)>=0&&videoCount===0){showToast('该原因需至少拍摄1段视频');return};submitting=true;document.getElementById('submit-btn').disabled=true;showLoading('提交中...')
  try{var body={lossType:'arrival',lossObject:'finished',materialId:selected.materialId||null,materialName:selected.materialName,spec:selected.spec||'',inputUnit:inputUnit,inputQty:qty,unitPrice:unitPrice||null,totalAmount:unitPrice>0?parseFloat((qty*unitPrice).toFixed(2)):null,qimaiOrderNo:orderNo,reason:reason,remark:remark,voucherUrl:mediaList.filter(function(m){return m.url}).map(function(m){return m.url}).join(','),urgent:isUrgent?1:0};var res=await fetch((RESUBMIT_ID?API+'/loss-report/'+RESUBMIT_ID+'/resubmit':API+'/loss-report'),{method:'POST',headers:H(),body:JSON.stringify(body)});var d=await res.json();if(d.code!==200)throw new Error(d.message||'提交失败');wx.miniProgram.postMessage({data:{type:'loss-submitted'}});showLoading('提交成功');setTimeout(function(){wx.miniProgram.navigateBack({delta:1})},500)}catch(e){showToast('提交失败: '+e.message);submitting=false;document.getElementById('submit-btn').disabled=false;hideLoading()}}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function showLoading(msg){document.getElementById('loading-msg').textContent=msg;document.getElementById('loading').style.display='flex'}
function hideLoading(){document.getElementById('loading').style.display='none'}
renderReasons();initGuideVideoUrl();loadOrders();renderMedia();renderGuideCard();updateHint()
if(RESUBMIT_ID){(async function prefill(){
  showLoading('加载报损信息...')
  try{var res=await fetch(API+'/loss-report/'+RESUBMIT_ID,{headers:H()});var d=await res.json()
    if(d.code!==200||!d.data){hideLoading();showToast('加载失败: '+(d.message||'无数据'));return}
    var r=d.data
    // 物料
    if(r.materialId){selected={materialId:r.materialId,materialName:r.materialName,spec:r.spec||'',baseUnit:r.baseUnit||'',stockUnit:r.inputUnit||'',unitPrice:r.unitPrice||0};document.getElementById('search-tap').style.display='none';document.getElementById('selected-item').style.display='flex';document.getElementById('sel-name').textContent=r.materialName+(r.spec?' · '+r.spec:'');if(isAvocado(selected)){document.getElementById('supplier-card').style.display='block';document.getElementById('order-info').style.display='none'}else{document.getElementById('supplier-card').style.display='none'}}
    // 企迈单号
    _selectedOrder={declareNo:r.qimaiOrderNo,requireNo:r.qimaiOrderNo,products:[],createdAt:''}; if(r.qimaiOrderNo){renderSelectedOrder()}
    // 加急
    if(r.urgent===1){isUrgent=true;document.getElementById('urgent-yes').className='pill on';document.getElementById('urgent-yes').style.cssText='border-color:#E05A47;color:#E05A47;background:#FEF0EF';document.getElementById('urgent-no').className='pill'}
    // 单位+数量+金额
    inputUnit=r.inputUnit||'';unitPrice=Number(r.unitPrice)||0
    // 尝试搜索物料获取完整信息（units/unitInfos）
    if(r.materialId){try{var matRes=await fetch(API+'/loss-report/materials/search?keyword='+encodeURIComponent(r.materialName)+'&lossObject=finished',{headers:H()});var matD=await matRes.json();var matList=(matD.data&&matD.data.list)||[]
      for(var k=0;k<matList.length;k++){if(matList[k].materialId===r.materialId){selected=matList[k];inputUnit=r.inputUnit||selected.stockUnit||selected.baseUnit||'';unitPrice=resolvePrice(selected,inputUnit);renderUnits();break}}}catch(e){console.log('material search failed:',e)}}
    document.getElementById('unit-label').textContent=inputUnit;document.getElementById('qty').value=r.inputQty||'';calcAmount()
    if(r.materialId){document.getElementById('unit-card').style.display='block'}
    // 原因
    if(r.reason){var pills=document.getElementById('reason-pills').children;for(var j=0;j<pills.length;j++){if(pills[j].textContent===r.reason){pills[j].className='pill on'}else{pills[j].className='pill'}}}
    // 备注
    var displayRemark=r.remark||'';var supMatch=displayRemark.match(/^【(hass牛油果|蓝蛙牛油果)】/);if(supMatch){_avocadoSupplier=supMatch[1];displayRemark=displayRemark.replace(/^【(hass牛油果|蓝蛙牛油果)】/,'').trim();selectSupplier(_avocadoSupplier)}document.getElementById('remark').value=displayRemark;document.getElementById('remark-required').style.display=r.reason==='错发'?'inline':'none'
    // 凭证
    if(r.voucherUrl){var urls=r.voucherUrl.split(',').filter(Boolean);for(var u=0;u<urls.length;u++){mediaList.push({url:urls[u],isVideo:urls[u].match(/\.(mp4|mov|avi|mkv|webm)/i)?true:false,uploading:false,failed:false,size:0,progress:100})}}
    renderMedia();updateHint();renderGuideCard()
    hideLoading()
  }catch(e){hideLoading();console.log('prefill error:',e);showToast('加载失败，请重试')}})()}
</script>
