server:
  port: 30261
  servlet:
    context-path: /storeInventory
  tomcat:
    max-http-form-post-size: 320MB

spring:
  profiles:
    active: prod   # dev=本地Mock | prod=生产环境
  servlet:
    multipart:
      max-file-size: 310MB
      max-request-size: 310MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  scheduling:
    enabled: true  # 定时任务总开关：生产实例 true（默认）；测试实例启动加 APP_SCHEDULING_ENABLED=false 防双实例重复发（双实例共库）
  sync:
    enabled: false  # 暂时关闭物料/门店外部API同步
  upload:
    path: /data/inventory-upload
  public-url: https://www.xzcpc-9pd.top/storeInventory

store:
  api:
    url: http://119.45.162.160:5174/api/publish/entities/mendianxinxi/records

xinfo:
  api:
    url: ${XINFO_API_URL:http://162.14.122.80:18088}
    key: ${XINFO_API_KEY}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

wx:
  miniapp:
    appid: wx3081dfa30167bb6e
    msg-data-format: JSON

mp:
  jwt:
    expire-hours: 168

# 小程序订阅消息（用户在 mp.weixin.qq.com 功能-订阅消息 申请"一次性订阅消息"模板后填入 template-id；
# 模板字段按序取 3 个关键词：thing1 标题 / thing2 说明 / time1 时间，与 SubscribeMessageService.data 组装一致）
notify:
  subscribe:
    # 订阅消息模板「工作任务待办通知」#49925（2026-09-03 申请）：thing1 待办类型 / thing2 待办内容 / time3 时间
    template-id: qOc6NgXrAjFSqZNJ8SQnwMPAt-7bfkiBdk72bSNGzKU
    miniprogram-state: ${NOTIFY_SUBSCRIBE_MINIPROGRAM_STATE:formal}   # 体验版调试改 trial

# 飞书异常告警 → 飞书群自定义机器人 Webhook
feishu:
  alert:
    enabled: ${FEISHU_ALERT_ENABLED:true}
    webhook-url: ${FEISHU_ALERT_WEBHOOK_URL:}
    app-name: 象掌柜-小程序端

# B1 问题处理：象目经理外部系统对接
# enabled=false 时 sync-external / records / reply 代理仍正常可用（仅推送/回调禁用）
xiangmu:
  enabled: false
  base-url: https://www.xzcpc-9pd.top
  api-key: 3707d9d759ccacb2dab2da4050a25985
  records-api-key: wx3081dfa30167bb6e
  app-key:
  secret:
  callback-token:

# 企迈 OpenAPI（报货单查询等）
qmai:
  open-id: 71fcea7abc9709d653693116410b5385
  grant-code: WaGI2rqy9b
  open-key: KYDwl5j39Wb71bff5fe6b0434ac6366a913c0dbc947q1SpQyZ
  base-url: https://openapi.qmai.cn
  console:
    base-url: https://inapi.qmai.cn
    cookie: ${QMAI_CONSOLE_COOKIE:}
    seller-id: ${QMAI_CONSOLE_SELLER_ID:216708}

# 小象数据 OpenAPI（财报明细数据源）
openapi:
  finance:
    base-url: ${OPENAPI_FINANCE_URL:http://119.45.162.160:8000}
