# ---------- 总部端管理员 JWT ----------
app:
  public-url: https://www.xzcpc-9pd.top
  upload:
    path: /data/inventory-upload
  # 物料同步开关（xinfo）：迁移未完成，全部写死关闭
  # 开启同步：把 enabled 改为 true → 重新打包部署（脚本/服务器无需任何配置）
  sync:
    enabled: false
    # 全量镜像开关：insert-new=接口有库里没有的插入；delete-absent=接口没有的 del_flag=1（淘汰）
    # 全量校准完成后开一次，跑完改回 false 重新打包
    insert-new: false
    delete-absent: false
    # 半成品同步开关：2026-08-31 测试库验证通过，开启（每日凌晨 3 点同步 86 个半成品+配方）
    semi-enabled: true

admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET}
    expire-hours: 72
  local-dev-login:
    enabled: false

