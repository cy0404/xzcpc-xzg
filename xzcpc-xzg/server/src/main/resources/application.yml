spring:
  profiles:
    active: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  sync:
    enabled: false  # 暂时关闭物料/门店外部API同步
  upload:
    path: ./upload
  server-url: http://162.14.122.80:4026

logging:
  level:
    com.xzcpc: DEBUG
    org.springframework.web: DEBUG
    com.xzcpc.template.mapper: DEBUG

store:
  api:
    url: ${STORE_API_URL:http://119.45.162.160:5174/api/publish/entities/mendianxinxi/records}
    key: ${STORE_API_KEY}

xinfo:
  api:
    url: ${XINFO_API_URL:http://162.14.122.80:18088}
    key: ${XINFO_API_KEY}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

wx:
  miniapp:
    appid: wx0000000000000001
    secret: ${WX_APP_SECRET}
    msg-data-format: JSON

mp:
  jwt:
    secret: ${MP_JWT_SECRET}
    expire-hours: 168

# 飞书应用配置（H5 登录）
feishu:
  app-id: cli_aa90f3d66d7adbb7
  app-secret: ${FEISHU_APP_SECRET}
  # 未验收问题提醒：本地测试固定群 chat_id（local 环境配置后不按门店分组，只发该群；生产保持空走门店群）
  issue-reminder-test-chat-id: ${FEISHU_ISSUE_REMINDER_TEST_CHAT_ID:}
  # 异常告警 → 飞书群自定义机器人 Webhook
  alert:
    enabled: ${FEISHU_ALERT_ENABLED:true}
    webhook-url: ${FEISHU_ALERT_WEBHOOK_URL:}
    app-name: 象掌柜-总部端

# 总部端管理员 JWT
report:
  api:
    token: ${REPORT_API_TOKEN}

admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET}
    expire-hours: 72

# B1 问题处理：象目经理外部系统对接（资料未就绪，先关闭）
# enabled=false 时启用过渡期人工推进端点 /api/admin/issue/{id}/sync-status
xiangmu:
  enabled: false
  base-url: https://www.xzcpc-9pd.top
  records-api-key: wx3081dfa30167bb6e

# 门店差评外部推送（复用象目 records-api-key）
negative-review:
  api-key: wx3081dfa30167bb6e
